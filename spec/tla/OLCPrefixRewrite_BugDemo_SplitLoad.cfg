\* Bug demonstration: the prefix length and bytes loaded separately, before
\* "Read each OLC descent's key prefix in one load".  A rewrite between the
\* two loads pairs two prefix versions, which fired the
\* shared_prefix_length == key_prefix_length assert of issue #899, even with
\* the survivor lock.  NoTornPrefix SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "get"
    Writers = {"collapse", "split"}
    SurvivorLock = TRUE
    SingleLoad = FALSE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
INVARIANT NoTornPrefix
