\* Bug demonstration: Step 3 at cut_level 0 locking the root pointer fresh and
\* clearing the root unchecked, before "Check every link a chain cut relies
\* on".  A prefix split of stk[0] installs a new root above it, and the cut
\* clears that root.  NoLostInsert SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 8
    Shape = "root_chain"
    Inserts = {"split_root"}
    LinkCheck = TRUE
    RootCheck = FALSE
INVARIANT NoLostInsert
CONSTRAINT StateConstraint
