\* Bug demonstration: try_remove_key_view's chain-I4 branch before "Check an
\* OLC chain I4 again after reading its child's value bit", which read the
\* value bit after its last check() and then read-locked the child as a node.
\* A concurrent insert's insert_at() can clear the bit of a slot that holds a
\* packed value.  NoDereferenceNonPointer SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS MaxVersion = 6
           VIS = TRUE
           ReCheck = FALSE
           WriterKinds = {"insert"}
CONSTRAINT StateConstraint
INVARIANT NoDereferenceNonPointer

CHECK_DEADLOCK FALSE
