\* Bug demonstration: try_remove_key_view's chain branch dropping the read
\* lock of a chain run's parent unchecked, before "Check a chain run's parent
\* before the key_view remove descends past it".  A prefix split of the first
\* chain node after the parent's last check moves only the parent's version,
\* so the remove walks the chain at the old depth: it misses a present key or
\* deletes a sibling.  NoStaleDepthResult SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "remove_chain"
    Writers = {"split"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
    HandOverCheck = FALSE
    KeyIsPrefix = FALSE
INVARIANT NoStaleDepthResult
