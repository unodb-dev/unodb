\* Reachability guard for OLCPrefixRewrite_Upsert.cfg: upsert catches a stale compare.
\* ReachStaleRestart SHOULD BE VIOLATED; if not, that config has become vacuous.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "upsert"
    Writers = {"collapse", "split"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
    KeyIsPrefix = FALSE
INVARIANT ReachStaleRestart
