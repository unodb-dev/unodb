\* Bug demonstration: Step 2 relocking a moved chain node at its current
\* version because it is still a one-child I4, without checking that its child
\* is the next node on the stack, before "Check every link a chain cut relies
\* on".  A prefix split of the chain node below it put a new I4 in that slot,
\* and the cut unlinks it.  NoLostInsert SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 8
    Shape = "root_chain"
    Inserts = {"split_c1"}
    LinkCheck = FALSE
    RootCheck = TRUE
INVARIANT NoLostInsert
CONSTRAINT StateConstraint
