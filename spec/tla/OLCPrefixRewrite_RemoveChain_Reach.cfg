\* Reachability guard for OLCPrefixRewrite_RemoveChain.cfg: chain remove catches a stale compare.
\* ReachStaleRestart SHOULD BE VIOLATED; if not, that config has become vacuous.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "remove_chain"
    Writers = {"collapse", "split"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
    KeyIsPrefix = FALSE
INVARIANT ReachStaleRestart
