\* Reachability guard for OLCChainCutVsSplit_InnerShrink.cfg: an inner shrink restarts after a split.
\* ReachRestartAfterSplit SHOULD BE VIOLATED; if not, that config has become vacuous.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 8
    Shape = "inner_shrink"
    Inserts = {"split_root", "split_c1"}
    LinkCheck = TRUE
    RootCheck = TRUE
CONSTRAINT StateConstraint
INVARIANT ReachRestartAfterSplit
