\* Bug demonstration: a get of an absent key, a strict prefix of stored keys
\* that ends inside a correct prefix, with no writer: dc47727e's sequential
\* trigger, before "Check for a key that ends inside an OLC inode's key
\* prefix".  NoKeyOverrun SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "get"
    Writers = {"none"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = FALSE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
    KeyIsPrefix = TRUE
INVARIANT NoKeyOverrun
