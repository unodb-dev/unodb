\* Stage 13, get of an absent key that ends inside a prefix, with and without
\* a concurrent writer, every fix.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "get"
    Writers = {"none", "collapse", "split"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
    KeyIsPrefix = TRUE
INVARIANT TypeOK
INVARIANT NoTornPrefix
INVARIANT NoKeyOverrun
INVARIANT NoStaleDepthResult
