\* Reachability guard for OLCChainCutVsSplit.cfg: a root chain cut restarts after a split.
\* ReachRestartAfterSplit SHOULD BE VIOLATED; if not, that config has become vacuous.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 8
    Shape = "root_chain"
    Inserts = {"split_root", "split_c1"}
    LinkCheck = TRUE
    RootCheck = TRUE
CONSTRAINT StateConstraint
INVARIANT ReachRestartAfterSplit
