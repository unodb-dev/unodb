\* Bug demonstration: an I4 collapse that rewrites the surviving inode's prefix
\* without write-locking it, before "Lock the surviving child when an OLC I4
\* collapses".  A get reports a present key absent, or descends at the wrong
\* depth.  NoStaleDepthResult SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "get"
    Writers = {"collapse"}
    SurvivorLock = FALSE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
INVARIANT NoStaleDepthResult
