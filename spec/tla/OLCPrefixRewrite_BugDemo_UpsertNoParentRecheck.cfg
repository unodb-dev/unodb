\* Bug demonstration: an upsert that validates P only before it read-locks S,
\* before "Check the parent before an OLC upsert's value-in-slot lambda".  A
\* rewrite that completes between the two moves only P's version, so S's check
\* passes, even with the survivor lock.  NoStaleDepthResult SHOULD BE
\* VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "upsert"
    Writers = {"collapse", "split"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = TRUE
    ParentRecheck = FALSE
    HandOverCheck = TRUE
INVARIANT NoStaleDepthResult
