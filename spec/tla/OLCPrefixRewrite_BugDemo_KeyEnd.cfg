\* Bug demonstration: no check for a key that ends inside the prefix, before
\* "Check for a key that ends inside an OLC inode's key prefix".  A collapse
\* lengthens the prefix past the end of a key at the old depth, and the
\* descent indexes the key there.  NoKeyOverrun SHOULD BE VIOLATED.
SPECIFICATION Spec
CONSTANTS
    ReaderKind = "get"
    Writers = {"collapse"}
    SurvivorLock = TRUE
    SingleLoad = TRUE
    KeyEndCheck = FALSE
    ParentRecheck = TRUE
    HandOverCheck = TRUE
    KeyIsPrefix = FALSE
INVARIANT NoKeyOverrun
